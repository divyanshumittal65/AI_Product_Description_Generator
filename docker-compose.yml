version: '3.8'

services:
  # 1. Docker Container serving small AI model (Ollama)
  model:
    image: ollama/ollama:latest
    container_name: product_ai_model
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always

  # 2. Persistent MySQL Database Container
  mysqldb:
    image: mysql:8.0
    container_name: product_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: product_desc
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  # 3. Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=mysql://root:rootpassword@mysqldb:3306/product_desc
      - MODEL_URL=http://model:11434
      - MODEL_NAME=qwen2.5:0.5b
    depends_on:
      - mysqldb
      - model
    restart: always

  # 4. Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: product_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: always

volumes:
  ollama_storage:
  mysql_data:
